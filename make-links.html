<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study link generator</title>
<!-- Makes one general study link per recruiter. The links contain only the
     recruiter code: each session gets its own random ID automatically, so links
     carry no information about who received them. -->
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --panel: #f6f8fa;
          --accent: #2f6fd0; --accent-fg: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e6e8eb; --muted: #9aa4af; --line: #343a42; --panel: #1f2329;
            --accent: #5b93e6; --accent-fg: #0d1117; color-scheme: dark; }
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
         margin: 0; padding: 32px 20px; }
  main { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 20px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border-radius: 6px;
          border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { color: var(--muted); min-height: 1.5em; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--panel); }
  td.link { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Study link generator</h1>
  <p class="lead">Makes one link per student. Each student shares their link with everyone they recruit:
    every session gets its own random ID and a random group automatically.</p>

  <div class="grid">
    <div><label for="base">Study address <span class="hint">(your GitHub Pages URL)</span></label>
      <input id="base" value="https://ed-sohoglu.github.io/adaptive-speech-prediction-task/"></div>
    <div><label for="codes">Recruiter codes <span class="hint">(as in RECRUITERS, separated by commas)</span></label>
      <input id="codes" placeholder="k4m9, p7t2"></div>
  </div>

  <div class="actions">
    <button class="primary" id="go">Make links</button>
    <button id="copy" disabled>Copy links</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="table-wrap" id="out" hidden></div>
</main>

<script>
  var links = [];
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  document.getElementById("go").onclick = function () {
    var msg = document.getElementById("msg");
    var base = document.getElementById("base").value.trim().split("?")[0];
    var codes = document.getElementById("codes").value.split(",")
      .map(function (c) { return c.trim().toLowerCase(); }).filter(Boolean);
    if (!/^https?:\/\//.test(base)) { msg.textContent = "Enter the full study address, starting with https://"; return; }
    if (!codes.length) { msg.textContent = "Enter at least one recruiter code."; return; }
    var bad = codes.filter(function (c) { return !/^[a-z0-9]+$/.test(c); });
    if (bad.length) { msg.textContent = "Codes should be letters and numbers only: " + bad.join(", "); return; }

    links = codes.map(function (c) { return { code: c, link: base + "?r=" + c }; });
    var h = "<table><thead><tr><th>Recruiter code</th><th>Link to share</th></tr></thead><tbody>";
    links.forEach(function (l) { h += "<tr><td>" + l.code + '</td><td class="link">' + esc(l.link) + "</td></tr>"; });
    var out = document.getElementById("out");
    out.innerHTML = h + "</tbody></table>"; out.hidden = false;
    document.getElementById("copy").disabled = false;
    msg.textContent = "Check each code matches an entry in RECRUITERS in experiment.js; unknown codes are refused.";
  };

  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(links.map(function (l) { return l.code + ": " + l.link; }).join("\n")).then(function () {
      document.getElementById("msg").textContent = "Links copied to the clipboard.";
    }, function () {
      document.getElementById("msg").textContent = "Couldn\u2019t copy automatically; select the links in the table instead.";
    });
  };
</script>
</body>
</html>
